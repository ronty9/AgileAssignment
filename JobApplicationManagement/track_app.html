<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Job Portal • Application Status</title>
  <link rel="stylesheet" href="track_app.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="logo">J</div>
        <div class="brand-text">
          <div class="brand-name">Job Portal</div>
          <div class="brand-sub">My Applications</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="grid">
      <section class="card">
        <div class="card-title">My Applications</div>
        <div id="applicationsList" class="list">
          </div>
      </section>

      <section class="card">
        <div class="card-title">Application Details</div>
        <div id="applicationDetail" class="muted">Select an application to view details.</div>
      </section>
    </div>
  </main>

  <script src="track_app.js"></script>
</body>
</html>
