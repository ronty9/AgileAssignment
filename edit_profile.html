<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Edit Profile</title>
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body class="settings-body">

  <div class="settings-layout">
    
    <div class="sidebar">
      <ul class="sidebar-menu">
        <li class="active">✏️ Edit profile</li>
        <li>🔔 Notification</li>
        <li>🔒 Security</li>
        <li>⚙️ Appearance</li>
      </ul>
    </div>

    <div class="content">
      <h2>Edit profile</h2>
      
      <div id="errorBox" class="alert alert-error"></div>
      <div id="successBox" class="alert alert-success">Profile updated successfully!</div>

      <form id="editForm">
        <div class="form-grid">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="fName" placeholder="First Name" maxlength="50">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lName" placeholder="Last Name" maxlength="50">
          </div>
          <div class="form-group full-width">
            <label>Email</label>
            <input type="email" id="email" readonly>
          </div>
          <div class="form-group full-width">
            <label>Contact Number</label>
            <input type="text" id="phone" placeholder="Contact Number" maxlength="15">
          </div>
        </div>

        <h3 class="section-title">Skills</h3>
        <button type="button" class="btn-add" onclick="addSkillRow()">+ Add Skill</button>
        <div id="skillsContainer"></div>

        <h3 class="section-title" style="margin-top: 30px;">Education</h3>
        <button type="button" class="btn-add" onclick="addEduRow()">+ Add Education</button>
        <div id="eduContainer"></div>

        <h3 class="section-title" style="margin-top: 30px;">Work Experience</h3>
        <button type="button" class="btn-add" onclick="addExpRow()">+ Add Experience</button>
        <div id="expContainer"></div>

        <div class="btn-container">
          <a href="profile.html" class="btn btn-cancel">Cancel</a>
          <button type="submit" class="btn btn-save">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/edit_profile.js"></script>
</body>
</html>
